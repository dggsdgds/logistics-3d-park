<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>物流园区 · Three.js 3D Demo</title>
<style>
  :root {
    --ink: #e8f2f9;
    --muted: #8ca0b3;
    --cyan: #5ad1ff;
    --bg: #05080d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  body {
    font-family: "Bahnschrift", "DIN Alternate", "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(2, 5, 9, .6) 100%);
  }

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 30px 36px;
    pointer-events: none;
  }
  .brand .eyebrow {
    margin-bottom: 10px;
    font-size: 11px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .brand h1 {
    margin: 0;
    font-size: clamp(26px, 3.2vw, 44px);
    font-weight: 600;
    letter-spacing: .1em;
    line-height: 1;
  }
  .brand p {
    margin: 9px 0 0;
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--muted);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-top: 4px;
    font-size: 10px;
    letter-spacing: .24em;
    color: var(--muted);
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }

  .footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 28px 36px;
    pointer-events: none;
  }
  .hint {
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .hint b {
    color: var(--ink);
    font-weight: 500;
  }
  .meta {
    text-align: right;
    font-size: 9px;
    line-height: 2;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #5d7285;
  }
  .meta span { color: var(--cyan); }

  /* first-person reticle */
  .crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 4;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border: 1px solid rgba(232, 246, 255, 0.42);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .crosshair::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px rgba(90, 209, 255, 0.9);
  }
  body.locked .crosshair { opacity: 1; }

  /* click-to-lock entry screen */
  .lock-overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 46%, rgba(10, 22, 34, 0.28), rgba(2, 5, 9, 0.82));
    backdrop-filter: blur(3px);
    cursor: pointer;
    transition: opacity .25s ease;
  }
  .lock-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .lock-card {
    position: relative;
    padding: 40px 56px 34px;
    text-align: center;
    border: 1px solid rgba(90, 209, 255, 0.28);
    background: linear-gradient(180deg, rgba(8, 16, 25, 0.9), rgba(4, 9, 15, 0.94));
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.65), inset 0 0 50px rgba(90, 209, 255, 0.04);
  }
  .lock-card::before,
  .lock-card::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    border: 1px solid var(--cyan);
    opacity: .75;
  }
  .lock-card::before {
    left: -1px;
    top: -1px;
    border-right: 0;
    border-bottom: 0;
  }
  .lock-card::after {
    right: -1px;
    bottom: -1px;
    border-left: 0;
    border-top: 0;
  }
  .lock-kicker {
    margin-bottom: 14px;
    font-size: 10px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .lock-card h2 {
    margin: 0;
    font-size: clamp(24px, 3vw, 32px);
    font-weight: 600;
    letter-spacing: .14em;
  }
  .lock-card p {
    margin: 12px 0 26px;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .lock-keys {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .lock-keys .sep {
    width: 1px;
    height: 18px;
    margin: 0 10px;
    background: rgba(140, 160, 179, 0.25);
  }
  .lock-keys kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 27px;
    height: 27px;
    border: 1px solid rgba(140, 160, 179, 0.38);
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.04);
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
  }
  .lock-keys .label { margin-left: 4px; }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-size: 11px;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--muted);
    transition: opacity .9s ease;
  }
  #loading.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #loading.error {
    color: #ff9a9a;
    letter-spacing: .16em;
    text-align: center;
    line-height: 2;
  }

  @media (max-width: 640px) {
    .hud, .footer { padding: 20px 20px; }
    .meta { display: none; }
    .brand p { display: none; }
    .lock-card { padding: 30px 26px 26px; }
    .lock-card h2 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div id="loading">LOADING SCENE</div>

  <header class="hud">
    <div class="brand">
      <div class="eyebrow">Three.js / Logistics Park</div>
      <h1>物流园区</h1>
      <p>WAREHOUSE · ROAD · DELIVERY LOOP</p>
    </div>
    <div class="status"><span class="dot"></span>FIRST PERSON</div>
  </header>

  <footer class="footer">
    <div class="hint"><b>W A S D</b> 移动 &nbsp;·&nbsp; <b>鼠标</b> 环视 &nbsp;·&nbsp; <b>ESC</b> 释放鼠标</div>
    <div class="meta">Pointer Lock <span>ON</span><br>Eye Height <span>1.7 M</span></div>
  </footer>

  <div class="crosshair"></div>

  <div id="lockOverlay" class="lock-overlay">
    <div class="lock-card">
      <div class="lock-kicker">First Person / Pointer Lock</div>
      <h2>点击进入园区</h2>
      <p>鼠标将被锁定并隐藏 &nbsp;·&nbsp; 按 ESC 释放</p>
      <div class="lock-keys">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="label">移动</span>
        <span class="sep"></span>
        <span class="label">鼠标环视</span>
      </div>
    </div>
  </div>

  <div class="vignette"></div>

  <script>
    window.__ready = false;
    setTimeout(function () {
      if (!window.__ready) {
        var el = document.getElementById('loading');
        el.classList.add('error');
        el.textContent = 'Three.js 加载失败 · 请检查网络后刷新';
      }
    }, 15000);
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://gcore.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://gcore.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    const EYE_HEIGHT = 1.7;

    /* ------------------------------------------------------------------ */
    /*  Renderer                                                           */
    /* ------------------------------------------------------------------ */
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    document.body.appendChild(renderer.domElement);

    const anisotropy = renderer.capabilities.getMaxAnisotropy();

    /* ------------------------------------------------------------------ */
    /*  Scene & camera                                                     */
    /* ------------------------------------------------------------------ */
    const scene = new THREE.Scene();
    scene.background = makeSkyTexture();
    scene.fog = new THREE.Fog(0x101c28, 68, 150);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      600
    );
    camera.rotation.order = 'YXZ';
    camera.position.set(17, EYE_HEIGHT, 21);
    camera.lookAt(0, 3.3, 0);

    /* ------------------------------------------------------------------ */
    /*  First-person controls                                              */
    /* ------------------------------------------------------------------ */
    const controls = new PointerLockControls(camera, renderer.domElement);

    const keys = new Set();
    const velocity = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const wish = new THREE.Vector3();

    const MOVE_SPEED = 6.2;
    const PLAYER_RADIUS = 0.42;
    const WORLD_LIMIT = 30;

    // Axis-aligned footprints the player cannot walk through.
    const SOLID_BOXES = [
      { minX: -4.2, maxX: 5.85, minZ: -4.2, maxZ: 4.2 },   // warehouse + dock
      { minX: -9.4, maxX: -7.0, minZ: -9.2, maxZ: -3.2 },  // container rows
      { minX: -9.4, maxX: -7.0, minZ: -1.7, maxZ: 4.3 },
      { minX: -9.4, maxX: -7.0, minZ: 5.8, maxZ: 11.8 }
    ];

    const lockOverlay = document.getElementById('lockOverlay');
    const lockTitle = lockOverlay.querySelector('h2');
    const lockNote = lockOverlay.querySelector('p');

    lockOverlay.addEventListener('click', () => controls.lock());

    controls.addEventListener('lock', () => {
      lockOverlay.classList.add('hidden');
      document.body.classList.add('locked');
    });

    controls.addEventListener('unlock', () => {
      lockOverlay.classList.remove('hidden');
      document.body.classList.remove('locked');
      keys.clear();
      velocity.set(0, 0, 0);
    });

    document.addEventListener('pointerlockerror', () => {
      lockTitle.textContent = '鼠标锁定失败';
      lockNote.textContent = '请再次点击页面，或检查浏览器的鼠标锁定权限';
    });

    window.addEventListener('keydown', (event) => {
      if (!controls.isLocked) return;
      if (event.code === 'KeyW' || event.code === 'KeyA' ||
          event.code === 'KeyS' || event.code === 'KeyD') {
        keys.add(event.code);
        event.preventDefault();
      }
    });

    window.addEventListener('keyup', (event) => {
      keys.delete(event.code);
    });

    window.addEventListener('blur', () => keys.clear());

    function resolveSolidCollisions(position) {
      for (const box of SOLID_BOXES) {
        const minX = box.minX - PLAYER_RADIUS;
        const maxX = box.maxX + PLAYER_RADIUS;
        const minZ = box.minZ - PLAYER_RADIUS;
        const maxZ = box.maxZ + PLAYER_RADIUS;

        if (position.x <= minX || position.x >= maxX ||
            position.z <= minZ || position.z >= maxZ) continue;

        const pushLeft = position.x - minX;
        const pushRight = maxX - position.x;
        const pushNear = position.z - minZ;
        const pushFar = maxZ - position.z;
        const smallest = Math.min(pushLeft, pushRight, pushNear, pushFar);

        if (smallest === pushLeft) position.x = minX;
        else if (smallest === pushRight) position.x = maxX;
        else if (smallest === pushNear) position.z = minZ;
        else position.z = maxZ;
      }
    }

    /* ------------------------------------------------------------------ */
    /*  Lights                                                             */
    /* ------------------------------------------------------------------ */
    const sun = new THREE.DirectionalLight(0xffe2b8, 4.2);
    sun.position.set(26, 20, -12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -30;
    sun.shadow.camera.right = 30;
    sun.shadow.camera.top = 30;
    sun.shadow.camera.bottom = -30;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 110;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.025;
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(sun);
    scene.add(sun.target);

    const skyFill = new THREE.HemisphereLight(0x9dc0e6, 0x121821, 1.0);
    scene.add(skyFill);

    const coolFill = new THREE.DirectionalLight(0x3a7bd5, 1.2);
    coolFill.position.set(-20, 11, -16);
    scene.add(coolFill);

    const frontFill = new THREE.DirectionalLight(0x9dc2e8, 1.1);
    frontFill.position.set(8, 10, 28);
    scene.add(frontFill);

    /* ------------------------------------------------------------------ */
    /*  Ground & grid                                                      */
    /* ------------------------------------------------------------------ */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 160),
      new THREE.MeshStandardMaterial({
        map: makeGridTexture(),
        color: 0xffffff,
        roughness: 0.95,
        metalness: 0.08
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    /* ------------------------------------------------------------------ */
    /*  Road                                                               */
    /* ------------------------------------------------------------------ */
    const ROAD_X = 10.2;
    const road = new THREE.Group();
    scene.add(road);

    const asphalt = new THREE.Mesh(
      new THREE.BoxGeometry(5.6, 0.08, 46),
      new THREE.MeshStandardMaterial({ color: 0x1e242c, roughness: 0.9, metalness: 0.12 })
    );
    asphalt.position.set(ROAD_X, 0.04, 0);
    asphalt.receiveShadow = true;
    road.add(asphalt);

    const edgeMat = new THREE.MeshStandardMaterial({
      color: 0x8fb6c9,
      roughness: 0.65,
      metalness: 0.1,
      emissive: 0x0d2b37,
      emissiveIntensity: 0.8
    });
    for (const x of [ROAD_X - 2.55, ROAD_X + 2.55]) {
      const edge = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.012, 46), edgeMat);
      edge.position.set(x, 0.086, 0);
      road.add(edge);
    }

    const dashMat = new THREE.MeshStandardMaterial({
      color: 0xc6d5df,
      roughness: 0.7,
      emissive: 0x1a2a33,
      emissiveIntensity: 0.5
    });
    for (let z = -22; z <= 22; z += 3.6) {
      const dash = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.012, 1.7), dashMat);
      dash.position.set(ROAD_X, 0.086, z);
      road.add(dash);
    }

    const apron = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 0.045, 8.6),
      new THREE.MeshStandardMaterial({ color: 0x1c232c, roughness: 0.92, metalness: 0.08 })
    );
    apron.position.set(6.6, 0.0225, 0);
    apron.receiveShadow = true;
    scene.add(apron);

    /* ------------------------------------------------------------------ */
    /*  Warehouse                                                          */
    /* ------------------------------------------------------------------ */
    const warehouse = new THREE.Group();
    scene.add(warehouse);

    const cladding = makeCladdingTexture();

    const pad = new THREE.Mesh(
      new THREE.BoxGeometry(10.8, 0.25, 10.8),
      new THREE.MeshStandardMaterial({ color: 0x1b222b, roughness: 0.9, metalness: 0.1 })
    );
    pad.position.y = 0.125;
    pad.castShadow = true;
    pad.receiveShadow = true;
    warehouse.add(pad);

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(8.4, 7, 8.4),
      new THREE.MeshStandardMaterial({
        map: cladding,
        color: 0xffffff,
        roughness: 0.62,
        metalness: 0.3
      })
    );
    body.position.y = 3.75;
    body.castShadow = true;
    body.receiveShadow = true;
    warehouse.add(body);

    const trimMat = new THREE.MeshStandardMaterial({
      color: 0x171d25,
      roughness: 0.55,
      metalness: 0.42
    });

    const roof = new THREE.Mesh(new THREE.BoxGeometry(8.8, 0.22, 8.8), trimMat);
    roof.position.y = 7.36;
    roof.castShadow = true;
    roof.receiveShadow = true;
    warehouse.add(roof);

    const roofGlowMat = new THREE.MeshBasicMaterial({
      color: 0x3fc8f0,
      transparent: true,
      opacity: 0.5,
      toneMapped: false
    });
    for (const [w, d, x, z] of [
      [8.52, 0.06, 0, 4.21],
      [8.52, 0.06, 0, -4.21],
      [0.06, 8.52, 4.21, 0],
      [0.06, 8.52, -4.21, 0]
    ]) {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, d), roofGlowMat);
      strip.position.set(x, 7.2, z);
      warehouse.add(strip);
    }

    // loading dock platform + canopy
    const platform = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 0.5, 8.4),
      new THREE.MeshStandardMaterial({ color: 0x252c35, roughness: 0.86, metalness: 0.12 })
    );
    platform.position.set(5.0, 0.25, 0);
    platform.castShadow = true;
    platform.receiveShadow = true;
    warehouse.add(platform);

    const canopy = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.16, 8.8), trimMat);
    canopy.position.set(5.1, 3.62, 0);
    canopy.castShadow = true;
    canopy.receiveShadow = true;
    warehouse.add(canopy);

    const doorMat = new THREE.MeshStandardMaterial({
      color: 0x0a0e13,
      roughness: 0.45,
      metalness: 0.55
    });
    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x343d48,
      roughness: 0.6,
      metalness: 0.35
    });
    const lampMat = new THREE.MeshStandardMaterial({
      color: 0x231708,
      emissive: 0xffb45e,
      emissiveIntensity: 3.2
    });

    for (const z of [-2.7, 0, 2.7]) {
      const frame = new THREE.Mesh(new THREE.BoxGeometry(0.12, 3.05, 2.08), frameMat);
      frame.position.set(4.19, 1.95, z);
      warehouse.add(frame);

      const door = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.82, 1.9), doorMat);
      door.position.set(4.22, 1.96, z);
      door.castShadow = true;
      warehouse.add(door);

      const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.42), lampMat);
      lamp.position.set(4.33, 3.5, z);
      warehouse.add(lamp);
    }

    // rooftop units
    const hvacMat = new THREE.MeshStandardMaterial({ color: 0x2c333c, roughness: 0.75, metalness: 0.3 });
    for (const [x, z, w, d] of [
      [-2.1, 1.6, 1.8, 1.1],
      [1.9, -1.9, 1.4, 1.6]
    ]) {
      const unit = new THREE.Mesh(new THREE.BoxGeometry(w, 0.55, d), hvacMat);
      unit.position.set(x, 7.73, z);
      unit.castShadow = true;
      unit.receiveShadow = true;
      warehouse.add(unit);
    }

    // glowing sign on the road-facing wall
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(4.6, 1.15),
      new THREE.MeshBasicMaterial({
        map: makeSignTexture('物流中心'),
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        toneMapped: false
      })
    );
    sign.position.set(4.23, 5.45, 0);
    sign.rotation.y = Math.PI / 2;
    warehouse.add(sign);

    /* ------------------------------------------------------------------ */
    /*  Shipping containers                                                */
    /* ------------------------------------------------------------------ */
    const containerGeo = new THREE.BoxGeometry(2.4, 2.5, 6);
    const containerColors = [0xc26a3a, 0x3d8f88, 0x66717f, 0xb09a4c];

    function addContainer(x, z, color, y = 1.25) {
      const mat = new THREE.MeshStandardMaterial({
        map: cladding,
        color,
        roughness: 0.72,
        metalness: 0.18
      });
      const box = new THREE.Mesh(containerGeo, mat);
      box.position.set(x, y, z);
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
      return box;
    }

    addContainer(-8.2, -6.2, containerColors[0]);
    addContainer(-8.2, -6.2, containerColors[2], 3.76);
    addContainer(-8.2, 1.3, containerColors[1]);
    addContainer(-8.2, 8.8, containerColors[3]);

    /* ------------------------------------------------------------------ */
    /*  Truck                                                              */
    /* ------------------------------------------------------------------ */
    const truck = new THREE.Group();
    truck.position.set(ROAD_X, 0.08, 0);
    scene.add(truck);

    const truckBody = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 1.9, 2.0),
      new THREE.MeshStandardMaterial({ color: 0xe2ecf4, roughness: 0.42, metalness: 0.25 })
    );
    truckBody.position.y = 1.39;
    truckBody.castShadow = true;
    truckBody.receiveShadow = true;
    truck.add(truckBody);

    const band = new THREE.Mesh(
      new THREE.BoxGeometry(2.03, 0.055, 2.03),
      new THREE.MeshBasicMaterial({ color: 0x2f9fc0, toneMapped: false })
    );
    band.position.y = 0.62;
    truck.add(band);

    const glass = new THREE.Mesh(
      new THREE.BoxGeometry(1.62, 0.66, 0.06),
      new THREE.MeshStandardMaterial({
        color: 0x0b1520,
        roughness: 0.12,
        metalness: 0.9,
        emissive: 0x0a2233,
        emissiveIntensity: 0.6
      })
    );
    glass.position.set(0, 1.78, 1.01);
    truck.add(glass);

    const headlightMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a14,
      emissive: 0xfff0c8,
      emissiveIntensity: 4
    });
    const tailMat = new THREE.MeshStandardMaterial({
      color: 0x220809,
      emissive: 0xff3b30,
      emissiveIntensity: 3
    });
    for (const x of [-0.63, 0.63]) {
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.17, 0.05), headlightMat);
      head.position.set(x, 0.94, 1.02);
      truck.add(head);

      const tail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.14, 0.05), tailMat);
      tail.position.set(x, 0.94, -1.02);
      truck.add(tail);
    }

    const beacon = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.07, 0.13, 12),
      new THREE.MeshStandardMaterial({
        color: 0x2a1a05,
        emissive: 0xffb03a,
        emissiveIntensity: 4
      })
    );
    beacon.position.set(0, 2.4, 0.55);
    truck.add(beacon);

    const wheelGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.27, 20);
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x090b0e, roughness: 0.9, metalness: 0.2 });
    const wheels = [];
    for (const x of [-1.02, 1.02]) {
      for (const z of [-0.68, 0.68]) {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.position.set(x, 0.36, z);
        wheel.castShadow = true;
        truck.add(wheel);
        wheels.push(wheel);
      }
    }

    /* ------------------------------------------------------------------ */
    /*  Distant sun                                                        */
    /* ------------------------------------------------------------------ */
    const sunSprite = makeSunSprite();
    sunSprite.position.set(234, 180, -108);
    scene.add(sunSprite);

    /* ------------------------------------------------------------------ */
    /*  Animation                                                          */
    /* ------------------------------------------------------------------ */
    const clock = new THREE.Clock();
    const truckPath = { prevZ: 0 };
    let elapsed = 0;
    let frames = 0;

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      // Smooth back-and-forth: sinusoidal position, gentle ease at both ends.
      const omega = 0.6;
      const phase = elapsed * omega;
      const z = Math.sin(phase) * 13;
      const truckSpeed = Math.cos(phase) * 13 * omega;

      truck.position.z = z;
      const targetYaw = truckSpeed >= 0 ? 0 : Math.PI;
      truck.rotation.y = THREE.MathUtils.damp(truck.rotation.y, targetYaw, 9, dt);

      const dz = z - truckPath.prevZ;
      for (const wheel of wheels) wheel.rotation.x += dz / 0.36;
      truckPath.prevZ = z;

      // First-person movement: horizontal only, relative to the camera yaw.
      const yaw = camera.rotation.y;
      forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
      right.set(Math.cos(yaw), 0, -Math.sin(yaw));

      wish.set(0, 0, 0);
      if (controls.isLocked) {
        const moveForward = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
        const moveRight = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
        wish.addScaledVector(forward, moveForward);
        wish.addScaledVector(right, moveRight);
        if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(MOVE_SPEED);
      }

      velocity.x = THREE.MathUtils.damp(velocity.x, wish.x, 12, dt);
      velocity.z = THREE.MathUtils.damp(velocity.z, wish.z, 12, dt);

      camera.position.x += velocity.x * dt;
      camera.position.z += velocity.z * dt;
      camera.position.y = EYE_HEIGHT;
      resolveSolidCollisions(camera.position);
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -WORLD_LIMIT, WORLD_LIMIT);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -WORLD_LIMIT, WORLD_LIMIT);

      renderer.render(scene, camera);

      if (++frames === 2) {
        document.getElementById('loading').classList.add('hidden');
        window.__ready = true;
      }
    });

    /* ------------------------------------------------------------------ */
    /*  Resize                                                             */
    /* ------------------------------------------------------------------ */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    /* ------------------------------------------------------------------ */
    /*  Procedural textures                                                */
    /* ------------------------------------------------------------------ */
    function makeGridTexture() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#1b222b';
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = '#41566b';
      ctx.lineWidth = 3;
      ctx.strokeRect(1.5, 1.5, size - 3, size - 3);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(80, 80);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 16;
      c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#060a12');
      grad.addColorStop(0.5, '#0b1420');
      grad.addColorStop(0.78, '#122232');
      grad.addColorStop(1, '#1b3146');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 16, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeCladdingTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#5b6875';
      ctx.fillRect(0, 0, 128, 128);
      for (let x = 0; x < 128; x += 8) {
        ctx.fillStyle = (x / 8) % 2 === 0
          ? 'rgba(255, 255, 255, 0.05)'
          : 'rgba(0, 0, 0, 0.16)';
        ctx.fillRect(x, 0, 4, 128);
      }
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      for (let y = 0; y < 128; y += 64) ctx.fillRect(0, y, 128, 2);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 4);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeSignTexture(text) {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 1024, 256);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 132px "Microsoft YaHei", "Segoe UI", sans-serif';
      ctx.shadowColor = 'rgba(90, 209, 255, 0.9)';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#dff6ff';
      ctx.fillText(text, 512, 132);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeSunSprite() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255, 253, 244, 1)');
      grad.addColorStop(0.07, 'rgba(255, 246, 219, 1)');
      grad.addColorStop(0.17, 'rgba(255, 226, 174, 0.62)');
      grad.addColorStop(0.46, 'rgba(255, 198, 124, 0.13)');
      grad.addColorStop(1, 'rgba(255, 180, 90, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false,
        fog: false
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.setScalar(48);
      return sprite;
    }
  </script>
</body>
