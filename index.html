<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>锦州港 · 集装箱码头 3D Demo</title>
<style>
  :root {
    --ink: #e8f2f9;
    --muted: #8ca0b3;
    --cyan: #5ad1ff;
    --bg: #05080d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  body {
    font-family: "Bahnschrift", "DIN Alternate", "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(2, 5, 9, .6) 100%);
  }

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 30px 36px;
    pointer-events: none;
  }
  .brand .eyebrow {
    margin-bottom: 10px;
    font-size: 11px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .brand h1 {
    margin: 0;
    font-size: clamp(30px, 3.4vw, 46px);
    font-weight: 600;
    letter-spacing: .12em;
    line-height: 1;
  }
  .brand p {
    margin: 9px 0 0;
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--muted);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    padding-top: 4px;
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 10px;
    letter-spacing: .24em;
    color: var(--muted);
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }

  .footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 28px 36px;
    pointer-events: none;
  }
  .hint {
    display: none;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .hint b {
    color: var(--ink);
    font-weight: 500;
  }
  .meta {
    text-align: right;
    white-space: nowrap;
    margin-left: auto;
    font-size: 9px;
    line-height: 2;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #5d7285;
  }
  .meta span { color: var(--cyan); }

  /* first-person reticle */
  .crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 4;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border: 1px solid rgba(232, 246, 255, 0.42);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .crosshair::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px rgba(90, 209, 255, 0.9);
  }
  body.locked .crosshair { opacity: 1; }

  /* click-to-lock entry screen */
  .lock-overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 46%, rgba(10, 22, 34, 0.28), rgba(2, 5, 9, 0.82));
    backdrop-filter: blur(3px);
    cursor: pointer;
    transition: opacity .25s ease;
  }
  .lock-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .lock-card {
    position: relative;
    padding: 40px 56px 34px;
    text-align: center;
    border: 1px solid rgba(90, 209, 255, 0.28);
    background: linear-gradient(180deg, rgba(8, 16, 25, 0.9), rgba(4, 9, 15, 0.94));
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.65), inset 0 0 50px rgba(90, 209, 255, 0.04);
  }
  .lock-card::before,
  .lock-card::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    border: 1px solid var(--cyan);
    opacity: .75;
  }
  .lock-card::before {
    left: -1px;
    top: -1px;
    border-right: 0;
    border-bottom: 0;
  }
  .lock-card::after {
    right: -1px;
    bottom: -1px;
    border-left: 0;
    border-top: 0;
  }
  .lock-kicker {
    margin-bottom: 14px;
    font-size: 10px;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: var(--cyan);
  }
  .lock-card h2 {
    margin: 0;
    font-size: clamp(24px, 3vw, 32px);
    font-weight: 600;
    letter-spacing: .14em;
  }
  .lock-card p {
    margin: 12px 0 26px;
    font-size: 12px;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .lock-keys {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .lock-keys .sep {
    width: 1px;
    height: 18px;
    margin: 0 10px;
    background: rgba(140, 160, 179, 0.25);
  }
  .lock-keys kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 27px;
    height: 27px;
    border: 1px solid rgba(140, 160, 179, 0.38);
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.04);
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
  }
  .lock-keys .label { margin-left: 4px; }

  /* context action (enter / exit truck) */
  .interact-prompt {
    position: fixed;
    left: 50%;
    bottom: 86px;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    border: 1px solid rgba(90, 209, 255, 0.3);
    background: rgba(4, 9, 15, 0.74);
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--ink);
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transform: translateX(-50%) translateY(6px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    pointer-events: none;
  }
  .interact-prompt.visible {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }  .interact-prompt kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 23px;
    height: 23px;
    padding: 0 5px;
    border: 1px solid rgba(90, 209, 255, 0.4);
    border-radius: 3px;
    background: rgba(90, 209, 255, 0.08);
    font-family: inherit;
    font-size: 11px;
    color: var(--cyan);
  }

  /* driving HUD: dark dashboard, speed readout and steering wheel */
  .drive-hud {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    height: 260px;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s ease, visibility .25s;
    background: linear-gradient(180deg,
      rgba(6, 8, 10, 0) 0%,
      rgba(7, 9, 11, .72) 22%,
      #080a0c 46%,
      #040506 100%);
  }
  .drive-hud::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(90, 209, 255, .35), transparent);
  }
  body.driving .drive-hud {
    opacity: 1;
    visibility: visible;
  }
  body.driving .crosshair {
    opacity: 0;
  }
  body.driving .interact-prompt {
    bottom: 282px;
  }

  .speed-panel {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    text-shadow: 0 0 18px rgba(90, 209, 255, 0.25);
  }
  .speed-label {
    font-size: 9px;
    letter-spacing: .36em;
    color: #6f818f;
    text-transform: uppercase;
  }
  .speed-readout {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    margin-top: 1px;
    font-family: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
  }
  #speedValue {
    font-size: 44px;
    line-height: 1;
    font-weight: 600;
    letter-spacing: .02em;
    color: #e8f7ff;
    font-variant-numeric: tabular-nums;
  }
  .speed-unit {
    font-size: 10px;
    letter-spacing: .16em;
    color: #6f8a9c;
  }

  .steering-wrap {
    position: absolute;
    left: 50%;
    bottom: 10px;
    width: 176px;
    height: 176px;
    transform: translateX(-50%);
  }
  .steering-wheel {
    width: 100%;
    height: 100%;
    transform-origin: 50% 50%;
    will-change: transform;
    filter: drop-shadow(0 12px 26px rgba(0, 0, 0, 0.65));
  }
  .steering-wheel svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-size: 11px;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--muted);
    transition: opacity .9s ease;
  }
  #loading.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #loading.error {
    color: #ff9a9a;
    letter-spacing: .16em;
    text-align: center;
    line-height: 2;
  }

  @media (max-width: 640px) {
    .hud, .footer { padding: 20px 20px; }
    .meta { display: none; }
    .brand p { display: none; }
    .lock-card { padding: 30px 26px 26px; }
    .lock-card h2 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div id="loading">LOADING TERMINAL</div>

  <header class="hud">
    <div class="brand">
      <div class="eyebrow">Three.js / Jinzhou Port</div>
      <h1>锦州港</h1>
      <p>JINZHOU PORT · CONTAINER TERMINAL</p>
    </div>
    <div class="status"><span class="dot"></span><span id="statusLabel">FIRST PERSON</span></div>
  </header>

  <footer class="footer">
    <div class="hint" id="footerHint"><b>W A S D</b> 移动 &nbsp;·&nbsp; <b>鼠标</b> 环视 &nbsp;·&nbsp; <b>ESC</b> 释放鼠标</div>
    <div class="meta">40FT Containers <span id="containerCount">—</span><br>Instanced <span>4 DRAWS</span></div>
  </footer>

  <div class="crosshair"></div>

  <div id="interactPrompt" class="interact-prompt">
    <span id="interactText">按 <kbd>E</kbd> 上车</span>
  </div>

  <div id="lockOverlay" class="lock-overlay">
    <div class="lock-card">
      <div class="lock-kicker">Jinzhou Port / Pointer Lock</div>
      <h2>点击进入码头</h2>
      <p>鼠标将被锁定并隐藏 &nbsp;·&nbsp; 按 ESC 释放</p>
      <div class="lock-keys">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="label">移动</span>
        <span class="sep"></span>
        <span class="label">鼠标环视</span>
      </div>
    </div>
  </div>

  <div class="vignette"></div>

  <div id="driveHud" class="drive-hud" aria-hidden="true">
    <div class="speed-panel">
      <div class="speed-label">速度</div>
      <div class="speed-readout">
        <span id="speedValue">0</span>
        <span class="speed-unit">km/h</span>
      </div>
    </div>

    <div class="steering-wrap">
      <div id="steeringWheel" class="steering-wheel">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="wheelRim" cx="50%" cy="35%" r="72%">
              <stop offset="0" stop-color="#4a515a"/>
              <stop offset="0.55" stop-color="#292e34"/>
              <stop offset="1" stop-color="#111417"/>
            </radialGradient>
            <radialGradient id="wheelHub" cx="45%" cy="35%" r="70%">
              <stop offset="0" stop-color="#434a53"/>
              <stop offset="1" stop-color="#171b1f"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="84" fill="none" stroke="#0a0c0e" stroke-width="24" opacity=".7"/>
          <circle cx="100" cy="100" r="84" fill="none" stroke="url(#wheelRim)" stroke-width="20"/>
          <circle cx="100" cy="100" r="73" fill="none" stroke="#59626c" stroke-width="1.2" opacity=".45"/>
          <g fill="#24292f" stroke="#4b535d" stroke-width="1.5">
            <rect x="92" y="21" width="16" height="66" rx="7"/>
            <rect x="92" y="21" width="16" height="66" rx="7" transform="rotate(120 100 100)"/>
            <rect x="92" y="21" width="16" height="66" rx="7" transform="rotate(240 100 100)"/>
          </g>
          <circle cx="100" cy="100" r="14" fill="url(#wheelHub)" stroke="#555e68" stroke-width="2"/>
          <circle cx="100" cy="100" r="4.5" fill="#5ad1ff" opacity=".75"/>
          <circle cx="100" cy="16" r="3.5" fill="#5ad1ff" opacity=".9"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    window.__ready = false;
    setTimeout(function () {
      if (!window.__ready) {
        var el = document.getElementById('loading');
        el.classList.add('error');
        el.textContent = 'Three.js 加载失败 · 请检查网络后刷新';
      }
    }, 30000);
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://gcore.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://gcore.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const EYE_HEIGHT = 1.7;
    const CONTAINER = { w: 2.44, h: 2.59, l: 12.19 };
    const AISLE_HALF = 7.2;
    const COL_PITCH = 2.76;
    const COLS = 8;
    const ROW_Z = [-48.5, -32.5, -16.5, 16.5, 32.5, 48.5];
    const SHIP_Z = -112;
    const WORLD = { minX: -115, maxX: 115, minZ: -77, maxZ: 205 };

    /* ------------------------------------------------------------------ */
    /*  Renderer                                                           */
    /* ------------------------------------------------------------------ */
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    const anisotropy = renderer.capabilities.getMaxAnisotropy();

    /* ------------------------------------------------------------------ */
    /*  Scene & camera                                                     */
    /* ------------------------------------------------------------------ */
    const scene = new THREE.Scene();
    scene.background = makeSkyTexture();
    scene.fog = new THREE.Fog(0x0e1c28, 170, 460);

    // HDR-ish image based lighting for the metal container surfaces.
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment();
    scene.environment = pmremGenerator.fromScene(roomEnvironment, 0.04).texture;
    scene.environmentIntensity = 0.3;
    roomEnvironment.dispose();
    pmremGenerator.dispose();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      800
    );
    camera.rotation.order = 'YXZ';
    camera.position.set(0, EYE_HEIGHT, 64);
    camera.lookAt(0, 4.2, -20);

    /* ------------------------------------------------------------------ */
    /*  First-person controls                                              */
    /* ------------------------------------------------------------------ */
    const controls = new PointerLockControls(camera, renderer.domElement);

    const keys = new Set();
    const velocity = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const wish = new THREE.Vector3();

    const trucks = [];
    const hangingCraneContainers = [];
    let activeTruck = null;
    let nearestTruck = null;

    const MOVE_SPEED = 6.2;
    const PLAYER_RADIUS = 0.42;

    const colliders = [];

    const lockOverlay = document.getElementById('lockOverlay');
    const lockTitle = lockOverlay.querySelector('h2');
    const lockNote = lockOverlay.querySelector('p');
    const interactPrompt = document.getElementById('interactPrompt');
    const interactText = document.getElementById('interactText');
    const footerHint = document.getElementById('footerHint');
    const statusLabel = document.getElementById('statusLabel');
    const speedValue = document.getElementById('speedValue');
    const steeringWheel = document.getElementById('steeringWheel');
    let steeringVisual = 0;
    const WALK_HINT = footerHint.innerHTML;
    const DRIVE_HINT = '<b>↑ ↓</b> 加速/倒车 &nbsp;·&nbsp; <b>← →</b> 转向 &nbsp;·&nbsp; <b>E</b> 下车';

    lockOverlay.addEventListener('click', () => controls.lock());

    controls.addEventListener('lock', () => {
      lockOverlay.classList.add('hidden');
      document.body.classList.add('locked');
    });

    controls.addEventListener('unlock', () => {
      lockOverlay.classList.remove('hidden');
      document.body.classList.remove('locked');
      keys.clear();
      velocity.set(0, 0, 0);
      if (activeTruck) activeTruck.speed = 0;
      interactPrompt.classList.remove('visible');
    });

    document.addEventListener('pointerlockerror', () => {
      lockTitle.textContent = '鼠标锁定失败';
      lockNote.textContent = '请再次点击页面，或检查浏览器的鼠标锁定权限';
    });

    window.addEventListener('keydown', (event) => {
      if (!controls.isLocked) return;

      if (event.code === 'KeyE') {
        if (!event.repeat) {
          event.preventDefault();
          toggleTruck();
        }
        return;
      }

      if (activeTruck) {
        if (event.code === 'ArrowUp' || event.code === 'ArrowDown' ||
            event.code === 'ArrowLeft' || event.code === 'ArrowRight') {
          keys.add(event.code);
          event.preventDefault();
        }
        return;
      }

      if (event.code === 'KeyW' || event.code === 'KeyA' ||
          event.code === 'KeyS' || event.code === 'KeyD') {
        keys.add(event.code);
        event.preventDefault();
      }
    });

    window.addEventListener('keyup', (event) => keys.delete(event.code));
    window.addEventListener('blur', () => {
      keys.clear();
      if (activeTruck) activeTruck.speed = 0;
    });

    function resolveSolidCollisions(position) {
      for (const box of colliders) {
        const minX = box.minX - PLAYER_RADIUS;
        const maxX = box.maxX + PLAYER_RADIUS;
        const minZ = box.minZ - PLAYER_RADIUS;
        const maxZ = box.maxZ + PLAYER_RADIUS;

        if (position.x <= minX || position.x >= maxX ||
            position.z <= minZ || position.z >= maxZ) continue;

        const pushLeft = position.x - minX;
        const pushRight = maxX - position.x;
        const pushNear = position.z - minZ;
        const pushFar = maxZ - position.z;
        const smallest = Math.min(pushLeft, pushRight, pushNear, pushFar);

        if (smallest === pushLeft) position.x = minX;
        else if (smallest === pushRight) position.x = maxX;
        else if (smallest === pushNear) position.z = minZ;
        else position.z = maxZ;
      }
    }

    /* ------------------------------------------------------------------ */
    /*  Lights                                                             */
    /* ------------------------------------------------------------------ */
    const sun = new THREE.DirectionalLight(0xffe2b8, 5.2);
    sun.position.set(75, 70, 45);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.camera.left = -105;
    sun.shadow.camera.right = 105;
    sun.shadow.camera.top = 105;
    sun.shadow.camera.bottom = -105;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 360;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(sun);
    scene.add(sun.target);

    const skyFill = new THREE.HemisphereLight(0x9dc0e6, 0x1b2027, 0.85);
    scene.add(skyFill);

    const ambient = new THREE.AmbientLight(0xc4d8ea, 0.18);
    scene.add(ambient);

    const coolFill = new THREE.DirectionalLight(0x4a8fce, 0.8);
    coolFill.position.set(-60, 40, -80);
    scene.add(coolFill);

    /* ------------------------------------------------------------------ */
    /*  Dock ground                                                        */
    /* ------------------------------------------------------------------ */
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 400),
      new THREE.MeshStandardMaterial({
        map: makeConcreteTexture(),
        color: 0xffffff,
        envMapIntensity: 0.35,
        roughness: 0.94,
        metalness: 0.06
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, 0, 120);
    ground.receiveShadow = true;
    scene.add(ground);

    /* ------------------------------------------------------------------ */
    /*  Quay edge & water                                                  */
    /* ------------------------------------------------------------------ */
    const quayWall = new THREE.Mesh(
      new THREE.BoxGeometry(620, 6, 2),
      new THREE.MeshStandardMaterial({ color: 0x343b43, roughness: 0.9, metalness: 0.08 })
    );
    quayWall.position.set(0, -2.6, -80.4);
    quayWall.receiveShadow = true;
    scene.add(quayWall);

    const quayCurb = new THREE.Mesh(
      new THREE.BoxGeometry(620, 0.6, 1.5),
      new THREE.MeshStandardMaterial({ color: 0x5a6068, roughness: 0.85, metalness: 0.1 })
    );
    quayCurb.position.set(0, 0.3, -79.4);
    quayCurb.receiveShadow = true;
    quayCurb.castShadow = true;
    scene.add(quayCurb);

    const quayStripe = new THREE.Mesh(
      new THREE.BoxGeometry(620, 0.08, 0.22),
      new THREE.MeshStandardMaterial({
        color: 0xe8c34c,
        roughness: 0.65,
        emissive: 0x3a2b06,
        emissiveIntensity: 0.35
      })
    );
    quayStripe.position.set(0, 0.62, -78.75);
    scene.add(quayStripe);

    const waterTexture = makeWaterTexture();
    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(700, 400),
      new THREE.MeshStandardMaterial({
        map: waterTexture,
        color: 0xffffff,
        roughness: 0.26,
        metalness: 0.35,
        envMapIntensity: 0.25,
        emissive: 0x0b2a3d,
        emissiveIntensity: 0.6
      })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, -0.45, -280);
    scene.add(water);

    // bollards along the quay
    const bollardMat = new THREE.MeshStandardMaterial({ color: 0x1a1f25, roughness: 0.6, metalness: 0.5 });
    const bollardCapMat = new THREE.MeshStandardMaterial({
      color: 0x8a6d1d,
      roughness: 0.55,
      emissive: 0x3a2b06,
      emissiveIntensity: 0.5
    });
    const bollardGeo = new THREE.CylinderGeometry(0.34, 0.4, 0.95, 12);
    const capGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.16, 12);
    for (let x = -66; x <= 66; x += 12) {
      const bollard = new THREE.Mesh(bollardGeo, bollardMat);
      bollard.position.set(x, 0.47, -77.2);
      bollard.castShadow = true;
      bollard.receiveShadow = true;
      scene.add(bollard);

      const cap = new THREE.Mesh(capGeo, bollardCapMat);
      cap.position.set(x, 0.98, -77.2);
      scene.add(cap);
    }

    /* ------------------------------------------------------------------ */
    /*  Yard lane markings                                                 */
    /* ------------------------------------------------------------------ */
    const paintYellow = new THREE.MeshStandardMaterial({
      color: 0xe8c34c,
      roughness: 0.7,
      metalness: 0.05,
      emissive: 0x3a2b06,
      emissiveIntensity: 0.3
    });
    const paintWhite = new THREE.MeshStandardMaterial({
      color: 0xdfe7ec,
      roughness: 0.75,
      metalness: 0.05
    });

    function addPaint(width, depth, x, z, material, y = 0.025) {
      const mark = new THREE.Mesh(new THREE.BoxGeometry(width, 0.025, depth), material);
      mark.position.set(x, y, z);
      mark.receiveShadow = true;
      scene.add(mark);
    }

    // wide central aisle edges
    addPaint(0.16, 112, -AISLE_HALF, 0, paintYellow);
    addPaint(0.16, 112, AISLE_HALF, 0, paintYellow);

    // dashed centre line
    for (let z = -52; z <= 58; z += 7) {
      addPaint(0.12, 2.8, 0, z, paintWhite);
    }

    // cross-aisle edges
    addPaint(58, 0.16, 0, -10.6, paintYellow);
    addPaint(58, 0.16, 0, 10.6, paintYellow);

    /* ------------------------------------------------------------------ */
    /*  Containers (single InstancedMesh)                                  */
    /* ------------------------------------------------------------------ */
    const rand = mulberry32(0x5eed2026);
    const palette = [
      0xb23a32, 0x1f5f8f, 0x2f7d4f, 0xd7a52a,
      0xd0642f, 0x3e6f8f, 0x8b929a, 0xd9dde1
    ];
    const placements = [];
    const color = new THREE.Color();

    function pushContainer(x, y, z, ry = 0) {
      color.setHex(palette[Math.floor(rand() * palette.length)]);
      color.offsetHSL(
        (rand() - 0.5) * 0.018,
        (rand() - 0.5) * 0.12,
        (rand() - 0.5) * 0.07
      );
      placements.push({ x, y, z, ry, color: color.clone() });
    }

    // Yard stacks: 8 columns per side, 6 rows deep, 2-4 containers high.
    for (const side of [-1, 1]) {
      for (let column = 0; column < COLS; column++) {
        const x = side * (AISLE_HALF + CONTAINER.w / 2 + column * COL_PITCH);

        for (const z of ROW_Z) {
          const height = 2 + Math.floor(rand() * 3);

          for (let level = 0; level < height; level++) {
            pushContainer(
              x,
              CONTAINER.h / 2 + level * (CONTAINER.h + 0.012),
              z
            );
          }

          colliders.push({
            minX: x - CONTAINER.w / 2,
            maxX: x + CONTAINER.w / 2,
            minZ: z - CONTAINER.l / 2,
            maxZ: z + CONTAINER.l / 2
          });
        }
      }
    }

    // Cargo on the container ship (same instanced mesh, long axis along X).
    for (let bay = 0; bay < 8; bay++) {
      const x = -58 + bay * 12.5;
      for (const rz of [-8.1, -5.4, -2.7, 0, 2.7, 5.4, 8.1]) {
        for (let level = 0; level < 2; level++) {
          pushContainer(
            x,
            7.65 + CONTAINER.h / 2 + level * (CONTAINER.h + 0.012),
            SHIP_Z + rz,
            Math.PI / 2
          );
        }
      }
    }

    // Bulk LOD yard: about ten times the original yard, outside the detailed
    // two-side blocks. These use a low-poly Blender GLB but the same instancing.
    const bulkPlacements = [];
    const BULK_START_X = 36.5;
    const BULK_COLS = 27;
    const BULK_ROWS = 17;

    for (const side of [-1, 1]) {
      for (let column = 0; column < BULK_COLS; column++) {
        const x = side * (BULK_START_X + column * COL_PITCH);

        for (let row = 0; row < BULK_ROWS; row++) {
          const z = -48.5 + row * 15.2;
          const height = 3 + Math.floor(rand() * 3);
          const ry = ((column + row + (side > 0 ? 1 : 0)) % 4 === 0) ? Math.PI : 0;

          for (let level = 0; level < height; level++) {
            color.setHex(palette[Math.floor(rand() * palette.length)]);
            color.offsetHSL(
              (rand() - 0.5) * 0.018,
              (rand() - 0.5) * 0.12,
              (rand() - 0.5) * 0.07
            );
            bulkPlacements.push({
              x,
              y: CONTAINER.h / 2 + level * (CONTAINER.h + 0.012),
              z,
              ry,
              color: color.clone()
            });
          }

          colliders.push({
            minX: x - CONTAINER.w / 2,
            maxX: x + CONTAINER.w / 2,
            minZ: z - CONTAINER.l / 2,
            maxZ: z + CONTAINER.l / 2
          });
        }
      }
    }

    const containerGeo = new THREE.BoxGeometry(CONTAINER.w, CONTAINER.h, CONTAINER.l);
    const containerTex = makeContainerTexture();
    const containerBump = makeContainerBumpTexture();
    const containerMat = new THREE.MeshStandardMaterial({
      map: containerTex,
      bumpMap: containerBump,
      bumpScale: 0.1,
      roughness: 0.6,
      metalness: 0.8,
      envMapIntensity: 1.1,
      color: 0xffffff
    });

    const containers = new THREE.InstancedMesh(containerGeo, containerMat, placements.length);
    containers.name = 'containers';
    containers.castShadow = true;
    containers.receiveShadow = true;
    containers.frustumCulled = false;
    containers.instanceMatrix.setUsage(THREE.StaticDrawUsage);

    const dummy = new THREE.Object3D();
    placements.forEach((item, index) => {
      dummy.position.set(item.x, item.y, item.z);
      dummy.rotation.set(0, item.ry, 0);
      dummy.updateMatrix();
      containers.setMatrixAt(index, dummy.matrix);
      containers.setColorAt(index, item.color);
    });

    containers.instanceMatrix.needsUpdate = true;
    containers.instanceColor.needsUpdate = true;
    scene.add(containers);

    document.getElementById('containerCount').textContent = placements.length + bulkPlacements.length;

    /* ------------------------------------------------------------------ */
    /*  Quay cranes                                                        */
    /* ------------------------------------------------------------------ */
    const craneSteel = new THREE.MeshStandardMaterial({
      color: 0xb9c4ce,
      roughness: 0.55,
      metalness: 0.4
    });
    const craneAccent = new THREE.MeshStandardMaterial({
      color: 0xb4402e,
      roughness: 0.6,
      metalness: 0.25
    });
    const craneDark = new THREE.MeshStandardMaterial({
      color: 0x242a31,
      roughness: 0.7,
      metalness: 0.4
    });
    const craneGlass = new THREE.MeshStandardMaterial({
      color: 0x0a1720,
      roughness: 0.15,
      metalness: 0.8
    });

    function createCrane(x) {
      const group = new THREE.Group();
      group.position.set(x, 0, -62);

      const addBox = (w, h, d, px, py, pz, material) => {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
        mesh.position.set(px, py, pz);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
        return mesh;
      };

      const legHeight = 24;

      for (const sx of [-11, 11]) {
        for (const sz of [-6, 6]) {
          addBox(1.15, legHeight, 1.15, sx, legHeight / 2, sz, craneSteel);
          colliders.push({
            minX: x + sx - 0.58,
            maxX: x + sx + 0.58,
            minZ: -62 + sz - 0.58,
            maxZ: -62 + sz + 0.58
          });
        }
      }

      addBox(1.4, 1.4, 13, -11, 24.7, 0, craneSteel);
      addBox(1.4, 1.4, 13, 11, 24.7, 0, craneSteel);
      addBox(23.4, 1.4, 1.4, 0, 24.7, -6, craneSteel);
      addBox(23.4, 1.4, 1.4, 0, 24.7, 6, craneSteel);

      addBox(4.5, 5.5, 4.5, 0, 27.6, 2.3, craneAccent);
      addBox(2.6, 1.3, 60, 0, 25.2, -23, craneSteel);
      addBox(2.8, 0.25, 60, 0, 25.95, -23, craneAccent);

      addBox(3.0, 2.6, 3.0, 0, 21.7, -8, craneAccent);
      addBox(2.4, 1.1, 0.08, 0, 22.2, -9.55, craneGlass);

      addBox(3.4, 1.2, 3.4, 0, 23.8, -35, craneDark);
      for (const sx of [-1.1, 1.1]) {
        addBox(0.08, 7.5, 0.08, sx, 20.1, -35, craneDark);
      }
      addBox(3.0, 0.45, 12.6, 0, 16.2, -35, craneDark);

      const hangingColor = x === 0 ? 0xc96a2b : 0x2f7d4f;
      const hangingMat = containerMat.clone();
      hangingMat.color.setHex(hangingColor);
      const hanging = new THREE.Mesh(containerGeo, hangingMat);
      hanging.position.set(0, 14.55, -35);
      hanging.castShadow = true;
      hanging.receiveShadow = true;
      group.add(hanging);
      hangingCraneContainers.push({ mesh: hanging, color: hangingColor });

      return group;
    }

    scene.add(createCrane(0));
    scene.add(createCrane(-62));

    /* ------------------------------------------------------------------ */
    /*  Container ship                                                     */
    /* ------------------------------------------------------------------ */
    const ship = new THREE.Group();
    ship.position.set(0, 0, SHIP_Z);

    const shipHullTex = makeHullTexture();
    const shipHullMat = new THREE.MeshStandardMaterial({
      map: shipHullTex,
      bumpMap: shipHullTex,
      bumpScale: 0.02,
      color: 0x355064,
      roughness: 0.65,
      metalness: 0.3
    });
    const shipDeckMat = new THREE.MeshStandardMaterial({
      color: 0x3c434b,
      roughness: 0.8,
      metalness: 0.2
    });
    const shipWhiteMat = new THREE.MeshStandardMaterial({
      color: 0xd6dde3,
      roughness: 0.5,
      metalness: 0.2
    });
    const shipWindowMat = new THREE.MeshStandardMaterial({
      color: 0x0a1720,
      roughness: 0.15,
      metalness: 0.75
    });
    const shipRedMat = new THREE.MeshStandardMaterial({
      color: 0x8a2b25,
      roughness: 0.6,
      metalness: 0.25
    });

    function addShipBox(w, h, d, x, y, z, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      ship.add(mesh);
      return mesh;
    }

    addShipBox(160, 10, 26, 0, 2, 0, shipHullMat);
    addShipBox(160.3, 1.4, 26.3, 0, 0.2, 0, shipRedMat);
    addShipBox(160.4, 0.4, 26.4, 0, 6.85, 0, shipWhiteMat);
    addShipBox(157, 0.6, 24, 0, 7.3, 0, shipDeckMat);
    addShipBox(20, 15, 22, 60, 14.8, 0, shipWhiteMat);
    addShipBox(20.3, 2.4, 22.3, 60, 17.7, 0, shipWindowMat);
    addShipBox(6, 7, 8, 60, 24, 0, shipRedMat);
    scene.add(ship);

    /* ------------------------------------------------------------------ */
    /*  Distant ship slowly crossing the water                             */
    /* ------------------------------------------------------------------ */
    const sailingShip = new THREE.Group();
    sailingShip.position.set(-160, 0, -220);

    const sailHullMat = new THREE.MeshStandardMaterial({
      color: 0x243d50,
      roughness: 0.62,
      metalness: 0.35
    });
    const sailDeckMat = new THREE.MeshStandardMaterial({
      color: 0x4a525a,
      roughness: 0.8,
      metalness: 0.2
    });
    const sailWhiteMat = new THREE.MeshStandardMaterial({
      color: 0xd5dce2,
      roughness: 0.5,
      metalness: 0.2
    });

    function addSailingBox(w, h, d, x, y, z, material) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = false;
      mesh.receiveShadow = false;
      sailingShip.add(mesh);
      return mesh;
    }

    addSailingBox(120, 8, 20, 0, 2, 0, sailHullMat);
    addSailingBox(120.3, 1.2, 20.3, 0, 0.1, 0, shipRedMat);
    addSailingBox(117, 0.5, 18, 0, 6.4, 0, sailDeckMat);
    addSailingBox(16, 13, 18, 42, 12.5, 0, sailWhiteMat);
    addSailingBox(16.3, 2.2, 18.3, 42, 15.0, 0, shipWindowMat);
    addSailingBox(5, 6, 6, 42, 21, 0, shipRedMat);

    for (let i = 0; i < 10; i++) {
      const containerMat = new THREE.MeshStandardMaterial({
        color: palette[i % palette.length],
        roughness: 0.6,
        metalness: 0.5
      });
      addSailingBox(12, 2.55, 2.4, -48 + i * 9.2, 7.95, 4.2, containerMat);
      addSailingBox(12, 2.55, 2.4, -48 + i * 9.2, 7.95, -4.2, containerMat);
    }

    scene.add(sailingShip);

    /* ------------------------------------------------------------------ */
    /*  Terminal gate sign                                                 */
    /* ------------------------------------------------------------------ */
    const gateMat = new THREE.MeshStandardMaterial({
      color: 0x3a4650,
      roughness: 0.55,
      metalness: 0.5
    });

    function addGateBox(w, h, d, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), gateMat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    addGateBox(1.5, 9.2, 1.5, -10.5, 4.6, 82);
    addGateBox(1.5, 9.2, 1.5, 10.5, 4.6, 82);
    addGateBox(22.5, 2.8, 1.2, 0, 7.8, 82);
    colliders.push({ minX: -11.25, maxX: -9.75, minZ: 81.25, maxZ: 82.75 });
    colliders.push({ minX: 9.75, maxX: 11.25, minZ: 81.25, maxZ: 82.75 });

    const gateSign = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 2.5),
      new THREE.MeshBasicMaterial({
        map: makeGateSignTexture(),
        transparent: true,
        depthWrite: false,
        toneMapped: false
      })
    );
    gateSign.position.set(0, 7.8, 81.38);
    gateSign.rotation.y = Math.PI;
    scene.add(gateSign);

    /* ------------------------------------------------------------------ */
    /*  Distant sun                                                        */
    /* ------------------------------------------------------------------ */
    const sunSprite = makeSunSprite();
    sunSprite.position.set(270, 315, 162);
    scene.add(sunSprite);

    /* ------------------------------------------------------------------ */
    /*  Performance: render the static shadow map once                     */
    /* ------------------------------------------------------------------ */
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;

    /* ------------------------------------------------------------------ */
    /*  Blender container asset (body + hardware, instanced)               */
    /* ------------------------------------------------------------------ */
    let containerAssetReady = false;
    let bulkAssetReady = false;
    let truckAssetReady = false;

    (async () => {
      try {
        const gltf = await new GLTFLoader().loadAsync('assets/container.glb');
        gltf.scene.updateMatrixWorld(true);

        const bodyParts = [];
        const hardwareParts = [];

        gltf.scene.traverse((node) => {
          if (!node.isMesh) return;
          const material = Array.isArray(node.material) ? node.material[0] : node.material;
          const materialName = material?.name || '';
          const isHardware = /hardware/i.test(materialName) || /hardware/i.test(node.name);

          const geometry = node.geometry.clone();
          geometry.applyMatrix4(node.matrixWorld);

          if (isHardware) hardwareParts.push({ geometry, material });
          else bodyParts.push({ geometry, material });
        });

        if (!bodyParts.length) throw new Error('GLB has no painted container body');

        const matrixDummy = new THREE.Object3D();
        const makeInstances = (part, isBody) => {
          const material = part.material.clone();
          material.side = THREE.FrontSide;
          material.envMapIntensity = isBody ? 1.25 : 1.0;
          material.needsUpdate = true;

          if (isBody) {
            material.color.setHex(0xffffff);
            material.metalness = 0.8;
            material.roughness = 0.6;
          }

          const mesh = new THREE.InstancedMesh(part.geometry, material, placements.length);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.frustumCulled = false;
          mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);

          placements.forEach((item, index) => {
            matrixDummy.position.set(item.x, item.y, item.z);
            matrixDummy.rotation.set(0, item.ry + Math.PI, 0);
            matrixDummy.updateMatrix();
            mesh.setMatrixAt(index, matrixDummy.matrix);
            if (isBody) mesh.setColorAt(index, item.color);
          });

          mesh.instanceMatrix.needsUpdate = true;
          if (isBody) mesh.instanceColor.needsUpdate = true;
          scene.add(mesh);
          return mesh;
        };

        bodyParts.forEach((part) => makeInstances(part, true));
        hardwareParts.forEach((part) => makeInstances(part, false));

        // Use the detailed model for the two containers hanging from the cranes.
        const bodyTemplate = bodyParts[0];
        const hardwareTemplate = hardwareParts[0] || null;
        for (const item of hangingCraneContainers) {
          const old = item.mesh;
          const parent = old.parent;
          const group = new THREE.Group();
          group.position.copy(old.position);

          const bodyMesh = new THREE.Mesh(bodyTemplate.geometry, bodyTemplate.material.clone());
          bodyMesh.material.side = THREE.FrontSide;
          bodyMesh.material.color.setHex(item.color);
          bodyMesh.material.envMapIntensity = 1.25;
          bodyMesh.castShadow = true;
          bodyMesh.receiveShadow = true;
          group.add(bodyMesh);

          if (hardwareTemplate) {
            const hardwareMesh = new THREE.Mesh(hardwareTemplate.geometry, hardwareTemplate.material.clone());
            hardwareMesh.material.side = THREE.FrontSide;
            hardwareMesh.castShadow = true;
            hardwareMesh.receiveShadow = true;
            group.add(hardwareMesh);
          }

          parent.remove(old);
          parent.add(group);
        }

        // The fallback boxes are only used while the GLB is loading.
        scene.remove(containers);
        renderer.shadowMap.needsUpdate = true;

        console.log(
          `[port] Blender container loaded: ${bodyParts.length} body mesh(es), ` +
          `${hardwareParts.length} hardware mesh(es), ${placements.length} instances`
        );
      } catch (error) {
        console.warn('[port] Blender container failed to load; keeping fallback boxes.', error);
      } finally {
        containerAssetReady = true;
      }
    })();

    /* ------------------------------------------------------------------ */
    /*  LOD yard (10x containers, low-poly Blender asset)                  */
    /* ------------------------------------------------------------------ */
    (async () => {
      try {
        const gltf = await new GLTFLoader().loadAsync('assets/container_lod.glb');
        gltf.scene.updateMatrixWorld(true);

        const parts = [];
        gltf.scene.traverse((node) => {
          if (!node.isMesh) return;
          const material = Array.isArray(node.material) ? node.material[0] : node.material;
          const isHardware = /hardware/i.test(material?.name || '') || /hardware/i.test(node.name);
          const geometry = node.geometry.clone();
          geometry.applyMatrix4(node.matrixWorld);
          parts.push({ geometry, material, isHardware });
        });

        const matrixDummy = new THREE.Object3D();

        for (const part of parts) {
          const material = part.material.clone();
          material.side = THREE.FrontSide;
          material.envMapIntensity = 0.9;
          material.needsUpdate = true;

          if (!part.isHardware) {
            material.color.setHex(0xffffff);
            material.metalness = 0.8;
            material.roughness = 0.6;
          }

          const mesh = new THREE.InstancedMesh(part.geometry, material, bulkPlacements.length);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.frustumCulled = false;
          mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);

          bulkPlacements.forEach((item, index) => {
            matrixDummy.position.set(item.x, item.y, item.z);
            matrixDummy.rotation.set(0, item.ry, 0);
            matrixDummy.updateMatrix();
            mesh.setMatrixAt(index, matrixDummy.matrix);
            if (!part.isHardware) mesh.setColorAt(index, item.color);
          });

          mesh.instanceMatrix.needsUpdate = true;
          if (!part.isHardware) mesh.instanceColor.needsUpdate = true;
          scene.add(mesh);
        }

        renderer.shadowMap.needsUpdate = true;
        console.log(`[port] LOD yard loaded: ${bulkPlacements.length} instances`);
      } catch (error) {
        console.warn('[port] LOD container asset failed to load.', error);
      } finally {
        bulkAssetReady = true;
      }
    })();

    /* ------------------------------------------------------------------ */
    /*  Blender trucks + driving                                           */
    /* ------------------------------------------------------------------ */
    (async () => {
      try {
        const gltf = await new GLTFLoader().loadAsync('assets/truck.glb');
        const template = gltf.scene;

        // Make the cab glazing obviously transparent and keep it out of the
        // static shadow map; a soft blob shadow follows each truck instead.
        template.traverse((node) => {
          if (!node.isMesh) return;
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          for (const material of materials) {
            material.side = THREE.FrontSide;
            material.envMapIntensity = 1.0;
            if (/glass/i.test(material.name || '')) {
              material.transparent = true;
              material.opacity = 0.16;
              material.depthWrite = false;
              material.color.setHex(0xbfe6ff);
              material.roughness = 0.05;
              material.metalness = 0.0;
            }
            material.needsUpdate = true;
          }
        });

        const blobTexture = makeBlobShadowTexture();
        const spawns = [
          { x: 2.2, z: 56, heading: 0 },
          { x: 2.2, z: 30, heading: 0 },
          { x: 3.1, z: 2, heading: Math.PI }
        ];

        for (const spawn of spawns) {
          const group = new THREE.Group();
          const model = template.clone(true);
          model.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = false;
              node.receiveShadow = false;
            }
          });
          group.add(model);
          group.position.set(spawn.x, 0.02, spawn.z);
          group.rotation.y = spawn.heading;

          const mount = new THREE.Group();
          mount.position.set(-0.4, 2.0, -1.5);
          group.add(mount);

          const blob = new THREE.Mesh(
            new THREE.PlaneGeometry(6.2, 2.9),
            new THREE.MeshBasicMaterial({
              map: blobTexture,
              transparent: true,
              opacity: 0.5,
              depthWrite: false,
              toneMapped: false
            })
          );
          blob.rotation.x = -Math.PI / 2;
          blob.position.y = 0.015;
          group.add(blob);

          const wheels = [];
          model.traverse((node) => {
            if (/^Wheel/i.test(node.name)) wheels.push(node);
          });

          scene.add(group);
          trucks.push({
            group,
            mount,
            wheels,
            heading: spawn.heading,
            speed: 0
          });
        }

        console.log(`[port] Blender trucks loaded: ${trucks.length}, transparent glazing`);
      } catch (error) {
        console.warn('[port] Truck asset failed to load.', error);
      } finally {
        truckAssetReady = true;
      }
    })();

    let promptMode = '';

    function getNearestTruck() {
      let best = null;
      let bestDistance = 5.5;
      for (const truck of trucks) {
        const dx = camera.position.x - truck.group.position.x;
        const dz = camera.position.z - truck.group.position.z;
        const distance = Math.hypot(dx, dz);
        if (distance < bestDistance) {
          best = truck;
          bestDistance = distance;
        }
      }
      return best;
    }

    function pointBlocked(x, z, radius) {
      for (const box of colliders) {
        if (x > box.minX - radius && x < box.maxX + radius &&
            z > box.minZ - radius && z < box.maxZ + radius) {
          return true;
        }
      }
      return false;
    }

    function truckBlocked(x, z, heading) {
      for (const offset of [-2.0, 0, 2.0]) {
        const px = x - Math.sin(heading) * offset;
        const pz = z - Math.cos(heading) * offset;
        if (pointBlocked(px, pz, 0.95)) return true;
      }
      return false;
    }

    // Oriented 2D boxes around the trucks. The model is 5.6 x 2.0 m;
    // half extents include a small safety margin.
    const TRUCK_HALF_LENGTH = 2.9;
    const TRUCK_HALF_WIDTH = 1.05;

    function obbOverlap(ax, az, ah, bx, bz, bh) {
      const afx = -Math.sin(ah);
      const afz = -Math.cos(ah);
      const arx = Math.cos(ah);
      const arz = -Math.sin(ah);
      const bfx = -Math.sin(bh);
      const bfz = -Math.cos(bh);
      const brx = Math.cos(bh);
      const brz = -Math.sin(bh);
      const dx = bx - ax;
      const dz = bz - az;

      const axes = [
        [afx, afz],
        [arx, arz],
        [bfx, bfz],
        [brx, brz]
      ];

      for (const [nx, nz] of axes) {
        const distance = Math.abs(dx * nx + dz * nz);
        const radiusA =
          TRUCK_HALF_LENGTH * Math.abs(nx * afx + nz * afz) +
          TRUCK_HALF_WIDTH * Math.abs(nx * arx + nz * arz);
        const radiusB =
          TRUCK_HALF_LENGTH * Math.abs(nx * bfx + nz * bfz) +
          TRUCK_HALF_WIDTH * Math.abs(nx * brx + nz * brz);
        if (distance > radiusA + radiusB) return false;
      }
      return true;
    }

    function hitsOtherTruck(x, z, heading, self) {
      for (const truck of trucks) {
        if (truck === self) continue;
        if (obbOverlap(
          x, z, heading,
          truck.group.position.x, truck.group.position.z, truck.heading
        )) return true;
      }
      return false;
    }

    function pointInTruck(x, z, radius) {
      for (const truck of trucks) {
        const dx = x - truck.group.position.x;
        const dz = z - truck.group.position.z;
        const heading = truck.heading;
        const fx = -Math.sin(heading);
        const fz = -Math.cos(heading);
        const rx = Math.cos(heading);
        const rz = -Math.sin(heading);
        const localForward = dx * fx + dz * fz;
        const localRight = dx * rx + dz * rz;
        if (Math.abs(localForward) < TRUCK_HALF_LENGTH + radius &&
            Math.abs(localRight) < TRUCK_HALF_WIDTH + radius) {
          return true;
        }
      }
      return false;
    }

    function setPromptMode(mode) {
      if (mode === promptMode) return;
      promptMode = mode;
      if (mode === 'drive') {
        interactText.innerHTML = '方向键驾驶 &nbsp;·&nbsp; 按 <kbd>E</kbd> 下车';
      } else if (mode === 'enter') {
        interactText.innerHTML = '按 <kbd>E</kbd> 上车';
      }
    }

    function updateInteractPrompt() {
      if (!controls.isLocked) {
        interactPrompt.classList.remove('visible');
        return;
      }

      if (activeTruck) {
        setPromptMode('drive');
        interactPrompt.classList.add('visible');
        return;
      }

      nearestTruck = getNearestTruck();
      if (nearestTruck) {
        setPromptMode('enter');
        interactPrompt.classList.add('visible');
      } else {
        interactPrompt.classList.remove('visible');
      }
    }

    function enterTruck(truck) {
      if (!truck || activeTruck) return;

      activeTruck = truck;
      keys.clear();
      velocity.set(0, 0, 0);
      truck.speed = 0;

      // The camera becomes a child of the cab mount, so mouse look stays
      // relative to the truck while it turns.
      truck.mount.add(camera);
      camera.position.set(0, 0, 0);
      camera.rotation.set(0, 0, 0);

      footerHint.innerHTML = DRIVE_HINT;
      statusLabel.textContent = 'DRIVING';
      document.body.classList.add('driving');
      speedValue.textContent = '0';
      steeringVisual = 0;
      steeringWheel.style.transform = 'rotate(0deg)';
      promptMode = '';
      updateInteractPrompt();
    }

    function exitTruck() {
      const truck = activeTruck;
      if (!truck) return;

      truck.speed = 0;
      keys.clear();
      scene.attach(camera);

      const heading = truck.heading;
      const sideX = -Math.cos(heading);
      const sideZ = Math.sin(heading);
      let px = truck.group.position.x + sideX * 2.9;
      let pz = truck.group.position.z + sideZ * 2.9;

      if (pointBlocked(px, pz, 0.5) || pointInTruck(px, pz, 0.5)) {
        px = truck.group.position.x - sideX * 2.9;
        pz = truck.group.position.z - sideZ * 2.9;
      }
      if (pointBlocked(px, pz, 0.5) || pointInTruck(px, pz, 0.5)) {
        px = truck.group.position.x + Math.sin(heading) * 4.0;
        pz = truck.group.position.z + Math.cos(heading) * 4.0;
      }

      camera.position.set(px, EYE_HEIGHT, pz);
      camera.rotation.set(0, heading, 0);

      activeTruck = null;
      nearestTruck = null;
      footerHint.innerHTML = WALK_HINT;
      statusLabel.textContent = 'FIRST PERSON';
      document.body.classList.remove('driving');
      speedValue.textContent = '0';
      steeringVisual = 0;
      steeringWheel.style.transform = 'rotate(0deg)';
      promptMode = '';
      updateInteractPrompt();
    }

    function toggleTruck() {
      if (!controls.isLocked) return;

      if (activeTruck) {
        exitTruck();
        return;
      }

      const truck = getNearestTruck();
      if (truck) enterTruck(truck);
    }

    function updateActiveTruck(dt) {
      const truck = activeTruck;
      if (!truck) return;

      const throttle = (keys.has('ArrowUp') ? 1 : 0) - (keys.has('ArrowDown') ? 1 : 0);
      if (throttle > 0) truck.speed += 5.4 * dt;
      else if (throttle < 0) truck.speed -= 6.6 * dt;
      else truck.speed *= Math.exp(-1.8 * dt);

      if (throttle === 0 && Math.abs(truck.speed) < 0.02) truck.speed = 0;
      truck.speed = THREE.MathUtils.clamp(truck.speed, -3.2, 8.0);

      const steer = (keys.has('ArrowLeft') ? 1 : 0) - (keys.has('ArrowRight') ? 1 : 0);
      const oldHeading = truck.heading;
      let nextHeading = oldHeading;
      if (Math.abs(truck.speed) > 0.05) {
        const speedFactor = Math.min(Math.abs(truck.speed) / 2, 1);
        nextHeading += steer * 1.18 * dt * speedFactor * (truck.speed >= 0 ? 1 : -1);
      }

      const forwardX = -Math.sin(nextHeading);
      const forwardZ = -Math.cos(nextHeading);
      const nextX = truck.group.position.x + forwardX * truck.speed * dt;
      const nextZ = truck.group.position.z + forwardZ * truck.speed * dt;

      const margin = 2.5;
      const outside =
        nextX < WORLD.minX + margin || nextX > WORLD.maxX - margin ||
        nextZ < WORLD.minZ + margin || nextZ > WORLD.maxZ - margin;

      if (outside ||
          truckBlocked(nextX, nextZ, nextHeading) ||
          hitsOtherTruck(nextX, nextZ, nextHeading, truck)) {
        truck.speed = 0;
        truck.heading = oldHeading;
      } else {
        truck.heading = nextHeading;
        truck.group.position.x = nextX;
        truck.group.position.z = nextZ;
      }

      truck.group.rotation.y = truck.heading;

      for (const wheel of truck.wheels) {
        wheel.rotation.x -= truck.speed * dt / 0.42;
      }

      const kmh = Math.round(Math.abs(truck.speed) * 3.6);
      if (speedValue.textContent !== String(kmh)) {
        speedValue.textContent = String(kmh);
      }

      steeringVisual = THREE.MathUtils.damp(steeringVisual, steer * 110, 9, dt);
      steeringWheel.style.transform = `rotate(${steeringVisual.toFixed(1)}deg)`;
    }

    /* ------------------------------------------------------------------ */
    /*  Animation                                                          */
    /* ------------------------------------------------------------------ */
    const clock = new THREE.Clock();
    let elapsed = 0;
    let frames = 0;

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      waterTexture.offset.x = elapsed * 0.0022;
      waterTexture.offset.y = elapsed * 0.0011;

      sailingShip.position.x += dt * 1.1;
      if (sailingShip.position.x > 280) sailingShip.position.x = -280;

      if (activeTruck) {
        updateActiveTruck(dt);
      } else {
        // First-person movement: horizontal only, relative to camera yaw.
        const yaw = camera.rotation.y;
        forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
        right.set(Math.cos(yaw), 0, -Math.sin(yaw));

        wish.set(0, 0, 0);
        if (controls.isLocked) {
          const moveForward = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
          const moveRight = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
          wish.addScaledVector(forward, moveForward);
          wish.addScaledVector(right, moveRight);
          if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(MOVE_SPEED);
        }

        velocity.x = THREE.MathUtils.damp(velocity.x, wish.x, 12, dt);
        velocity.z = THREE.MathUtils.damp(velocity.z, wish.z, 12, dt);

        const previousX = camera.position.x;
        const previousZ = camera.position.z;

        camera.position.x += velocity.x * dt;
        camera.position.z += velocity.z * dt;
        camera.position.y = EYE_HEIGHT;

        resolveSolidCollisions(camera.position);
        camera.position.x = THREE.MathUtils.clamp(camera.position.x, WORLD.minX, WORLD.maxX);
        camera.position.z = THREE.MathUtils.clamp(camera.position.z, WORLD.minZ, WORLD.maxZ);

        if (pointInTruck(camera.position.x, camera.position.z, PLAYER_RADIUS)) {
          camera.position.x = previousX;
          camera.position.z = previousZ;
          velocity.x = 0;
          velocity.z = 0;
        }
      }

      updateInteractPrompt();

      renderer.render(scene, camera);

      if (++frames >= 2 && containerAssetReady && bulkAssetReady && truckAssetReady && !window.__ready) {
        document.getElementById('loading').classList.add('hidden');
        window.__ready = true;
      }
    });

    /* ------------------------------------------------------------------ */
    /*  Resize                                                             */
    /* ------------------------------------------------------------------ */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    /* ------------------------------------------------------------------ */
    /*  Procedural textures                                                */
    /* ------------------------------------------------------------------ */
    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function makeConcreteTexture() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#252a31';
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < 900; i++) {
        const v = Math.random() > 0.5 ? 255 : 0;
        ctx.fillStyle = `rgba(${v}, ${v}, ${v}, ${0.012 + Math.random() * 0.025})`;
        ctx.fillRect(Math.random() * size, Math.random() * size, 2 + Math.random() * 5, 2 + Math.random() * 5);
      }

      ctx.strokeStyle = '#171b20';
      ctx.lineWidth = 3;
      ctx.strokeRect(1.5, 1.5, size - 3, size - 3);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
      ctx.lineWidth = 1;
      ctx.strokeRect(4.5, 4.5, size - 9, size - 9);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(120, 80);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeContainerBumpTexture() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          // Vertical corrugation: grooves line up with the dark ribs in the colour map.
          const rib = 0.5 - 0.5 * Math.cos((x / size) * Math.PI * 2 * 4);
          let height = 80 + rib * 150;

          // Raised top / bottom rails.
          if (y < 10 || y > size - 10) height = 245;
          else if (y < 18 || y > size - 18) height = 190;

          // Raised corner posts.
          if (x < 6 || x > size - 6) height = 250;

          const i = (y * size + x) * 4;
          const v = Math.round(height);
          img.data[i] = v;
          img.data[i + 1] = v;
          img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
      }

      ctx.putImageData(img, 0, 0);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 1);
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeContainerTexture() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#e9e9e9';
      ctx.fillRect(0, 0, size, size);

      for (let x = 0; x < size; x += 64) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.20)';
        ctx.fillRect(x, 0, 7, size);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.34)';
        ctx.fillRect(x + 7, 0, 5, size);
      }

      ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
      ctx.fillRect(0, 0, size, 12);
      ctx.fillRect(0, size - 12, size, 12);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
      ctx.fillRect(0, 12, size, 3);
      ctx.fillRect(0, size - 15, size, 3);

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 1);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeHullTexture() {
      const w = 512;
      const h = 256;
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#dfe4e8';
      ctx.fillRect(0, 0, w, h);

      for (let x = 0; x < w; x += 64) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.20)';
        ctx.fillRect(x, 0, 4, h);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.fillRect(x + 4, 0, 2, h);
      }

      for (const y of [82, 164]) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fillRect(0, y, w, 2);
      }

      for (let i = 0; i < 14; i++) {
        const x = Math.random() * w;
        const grad = ctx.createLinearGradient(0, 150, 0, h);
        grad.addColorStop(0, 'rgba(70, 40, 22, 0)');
        grad.addColorStop(1, 'rgba(70, 40, 22, 0.10)');
        ctx.fillStyle = grad;
        ctx.fillRect(x, 150, 2 + Math.random() * 5, h - 150);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(12, 1);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeWaterTexture() {
      const size = 512;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, '#1b455c');
      grad.addColorStop(0.55, '#0d2a3e');
      grad.addColorStop(1, '#071a29');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      for (let y = 0; y < size; y += 7) {
        ctx.beginPath();
        for (let x = 0; x <= size; x += 16) {
          ctx.lineTo(x, y + Math.sin((x + y) * 0.028) * 3.5);
        }
        ctx.strokeStyle = `rgba(125, 190, 220, ${0.025 + Math.random() * 0.05})`;
        ctx.lineWidth = 1 + Math.random() * 1.5;
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(10, 10);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeBlobShadowTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 8, 128, 128, 122);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      grad.addColorStop(0.55, 'rgba(0, 0, 0, 0.28)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeGateSignTexture() {
      const c = document.createElement('canvas');
      c.width = 2048;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.clearRect(0, 0, 2048, 256);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(90, 209, 255, 0.85)';
      ctx.shadowBlur = 26;
      ctx.fillStyle = '#eaf8ff';
      ctx.font = '700 150px "Microsoft YaHei", "Segoe UI", sans-serif';
      ctx.fillText('锦州港', 1024, 100);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#8fd7ff';
      ctx.font = '500 42px "Bahnschrift", "Segoe UI", sans-serif';
      ctx.fillText('JINZHOU PORT  ·  CONTAINER TERMINAL', 1024, 192);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = anisotropy;
      return tex;
    }

    function makeSkyTexture() {
      const c = document.createElement('canvas');
      c.width = 16;
      c.height = 512;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#04070d');
      grad.addColorStop(0.5, '#09131d');
      grad.addColorStop(0.78, '#122433');
      grad.addColorStop(1, '#1c3346');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 16, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeSunSprite() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255, 253, 244, 1)');
      grad.addColorStop(0.07, 'rgba(255, 246, 219, 1)');
      grad.addColorStop(0.17, 'rgba(255, 226, 174, 0.62)');
      grad.addColorStop(0.46, 'rgba(255, 198, 124, 0.13)');
      grad.addColorStop(1, 'rgba(255, 180, 90, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false,
        fog: false
      });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.setScalar(72);
      return sprite;
    }
  </script>
